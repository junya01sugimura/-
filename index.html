<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共通テスト化学基礎 演習マスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🧪 共通テスト化学基礎 演習マスター
            </h1>
            <span id="header-stats" class="text-sm bg-indigo-700 px-3 py-1 rounded-full">習得度: -%</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 py-6">
        <!-- View: Category Selection -->
        <div id="view-select" class="space-y-6 fade-in">
            <!-- Mode Switcher -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3">
                <span class="font-bold text-slate-700 text-sm">出題モード選択:</span>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button id="mode-5q" onclick="setMode(5)" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-sm transition">
                        ⚡ ランダム 5 題
                    </button>
                    <button id="mode-all" onclick="setMode('ALL')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
                        📚 分野の全問題
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-2 text-indigo-900">分野を選択してスタート</h2>
                <p id="mode-description" class="text-slate-600 text-sm mb-4">選択した分野からランダムに5題が出題されます。スキマ時間の短時間演習に最適です。</p>
                <div id="category-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Categories will be rendered here -->
                </div>
            </div>

            <!-- Overall Stats -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-700 mb-3">全体の演習進捗状況</h3>
                <div class="w-full bg-slate-200 rounded-full h-4 mb-2">
                    <div id="overall-progress-bar" class="bg-indigo-600 h-4 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-sm text-slate-600">
                    <span id="overall-score-text">一度でも正解した問題: 0 / 0</span>
                    <button id="btn-reset" class="text-red-500 hover:text-red-700 underline text-xs">学習履歴をリセット</button>
                </div>
            </div>
        </div>

        <!-- View: Quiz Display -->
        <div id="view-quiz" class="hidden space-y-6 fade-in">
            <!-- Navigation Header -->
            <div class="flex justify-between items-center">
                <button id="btn-back" class="text-slate-600 hover:text-indigo-600 flex items-center gap-1 text-sm font-medium">
                    ← 分野選択に戻る
                </button>
                <span id="quiz-progress" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                    第 1 問 / 5 問
                </span>
            </div>

            <!-- Card Question -->
            <div class="bg-white rounded-xl shadow-md border border-slate-200 p-6">
                <div class="mb-4">
                    <span id="question-category" class="inline-block bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded font-semibold mb-2">分野名</span>
                    <h3 id="question-text" class="text-base md:text-lg font-bold text-slate-800 leading-relaxed">
                        問題文がここに入ります。
                    </h3>
                </div>

                <!-- Answer Options -->
                <div id="options-container" class="space-y-3 my-6">
                    <!-- Option buttons dynamically generated -->
                </div>

                <!-- Explanation Area (Hidden by default) -->
                <div id="explanation-box" class="hidden mt-6 p-4 rounded-lg bg-slate-50 border border-slate-200 fade-in">
                    <div id="result-badge" class="font-bold text-lg mb-2"></div>
                    <div id="explanation-text" class="text-slate-700 text-sm leading-relaxed mb-4"></div>
                    <button id="btn-next" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition">
                        次の問題へ ➔
                    </button>
                </div>
            </div>
        </div>

        <!-- View: Results -->
        <div id="view-result" class="hidden text-center space-y-6 fade-in">
            <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200">
                <div class="text-5xl mb-4">🎯</div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">演習完了！</h2>
                <p class="text-slate-600 mb-6">お疲れ様でした。今回の結果です。</p>

                <div class="text-4xl font-extrabold text-indigo-600 mb-6">
                    <span id="final-score">0</span> <span class="text-lg font-normal text-slate-500">/ <span id="final-total">0</span> 正解</span>
                </div>

                <div class="flex justify-center gap-4">
                    <button id="btn-retry" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow">
                        もう一度（別問題ランダム）
                    </button>
                    <button id="btn-home" class="px-6 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg">
                        トップへ戻る
                    </button>
                </div>
            </div>
        </div>
    </main>

        let currentCategory = "ALL";

        const viewSelect = document.getElementById("view-select");

        const viewResult = document.getElementById("view-result");

        // --- Functions ---
        function init() {
            renderCategories();
            updateOverallProgress();

            document.getElementById("btn-back").addEventListener("click", showCategorySelect);
            document.getElementById("btn-next").addEventListener("click", nextQuestion);
            document.getElementById("btn-retry").addEventListener("click", startQuiz);
            document.getElementById("btn-home").addEventListener("click", showCategorySelect);
            document.getElementById("btn-reset").addEventListener("click", resetProgress);
        }

        function setMode(mode) {
            playMode = mode;
            const btn5q = document.getElementById("mode-5q");
            const btnAll = document.getElementById("mode-all");
            const desc = document.getElementById("mode-description");

            if (mode === 5) {
                btn5q.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-sm transition";
                btnAll.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                desc.innerText = "選択した分野からランダムに5題が出題されます。スキマ時間の短時間演習に最適です。";
            } else {
                btnAll.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-sm transition";
                btn5q.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                desc.innerText = "選択した分野に含まれるすべての問題を順に演習します。";
            }
        }

        function renderCategories() {
            const categories = ["ALL", ...new Set(quizData.map(q => q.category))];
            categoryList.innerHTML = "";

            categories.forEach(cat => {
                const count = cat === "ALL" 
                    ? quizData.length 
                    : quizData.filter(q => q.category === cat).length;
                
                const btn = document.createElement("button");
                btn.className = "p-4 border border-slate-200 rounded-xl text-left hover:border-indigo-500 hover:bg-indigo-50 transition flex justify-between items-center group bg-slate-50 shadow-sm";
                btn.onclick = () => selectCategory(cat);

                const label = cat === "ALL" ? "全範囲総合問題" : cat;

                btn.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800 group-hover:text-indigo-600">${label}</div>
                        <div class="text-xs text-slate-500 mt-1">収録数: ${count} 題</div>
                    </div>
                    <span class="text-indigo-600 font-bold text-sm opacity-0 group-hover:opacity-100 transition">演習 ➔</span>
                `;
                categoryList.appendChild(btn);
            });
        }

        function updateOverallProgress() {
            const total = quizData.length;
            const solved = Object.keys(userProgress).length;
            const percentage = total > 0 ? Math.round((solved / total) * 100) : 0;

            overallProgressBar.style.width = `${percentage}%`;
            overallScoreText.innerText = `一度でも正解した問題: ${solved} / ${total}`;
            headerStats.innerText = `習得度: ${percentage}%`;
        }

        function selectCategory(cat) {
            currentCategory = cat;
            startQuiz();
        }

        function startQuiz() {
            let pool = [];
            if (currentCategory === "ALL") {
                pool = [...quizData];
            } else {
                pool = quizData.filter(q => q.category === currentCategory);
            }

            // Shuffle pool
            pool = pool.sort(() => Math.random() - 0.5);

            // Apply Mode limit
            if (playMode === 5) {
                activeQuestions = pool.slice(0, 5);
            } else {
                activeQuestions = pool;
            }

            currentIndex = 0;
            score = 0;

            viewSelect.classList.add("hidden");
            viewResult.classList.add("hidden");
            viewQuiz.classList.remove("hidden");

            displayQuestion();
        }

        function displayQuestion() {
            const q = activeQuestions[currentIndex];

            questionCategory.innerText = q.category;
            questionText.innerHTML = q.question;
            quizProgress.innerText = `第 ${currentIndex + 1} 問 / ${activeQuestions.length} 問`;

            explanationBox.classList.add("hidden");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-lg border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 font-medium text-slate-700 transition flex items-center justify-between text-sm md:text-base";
                btn.innerHTML = `<span>${idx + 1}. ${opt}</span>`;
                btn.onclick = () => checkAnswer(idx);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const q = activeQuestions[currentIndex];
            const isCorrect = selectedIndex === q.answer;

            if (isCorrect) {
                userProgress[q.id] = true;
                localStorage.setItem("chem_quiz_progress_v5", JSON.stringify(userProgress));
                updateOverallProgress();
            }

            const buttons = optionsContainer.querySelectorAll("button");
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.answer) {
                    btn.classList.add("bg-emerald-100", "border-emerald-500", "text-emerald-900", "font-bold");
                } else if (idx === selectedIndex) {
                    btn.classList.add("bg-rose-100", "border-rose-500", "text-rose-900");
                } else {
                    btn.classList.add("opacity-50");
                }
            });

            if (isCorrect) {
                score++;
                resultBadge.className = "font-bold text-lg mb-2 text-emerald-600";
                resultBadge.innerText = "⭕ 正解！";
            } else {
                resultBadge.className = "font-bold text-lg mb-2 text-rose-600";
                resultBadge.innerText = "❌ 不正解...";
            }

            explanationText.innerHTML = q.explanation;
            explanationBox.classList.remove("hidden");
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < activeQuestions.length) {
                displayQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            viewQuiz.classList.add("hidden");
            viewResult.classList.remove("hidden");

            document.getElementById("final-score").innerText = score;
            document.getElementById("final-total").innerText = activeQuestions.length;
        }

        function showCategorySelect() {
            viewQuiz.classList.add("hidden");
            viewResult.classList.add("hidden");
            viewSelect.classList.remove("hidden");
        }

        function resetProgress() {
            if (confirm("これまでの解答履歴をリセットしますか？")) {
                localStorage.removeItem("chem_quiz_progress_v5");
                userProgress = {};
                updateOverallProgress();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
